<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#ffffff"/>
  
  <!-- Left vertical line (dark navy) -->
  <rect x="40" y="30" width="12" height="140" fill="#2C3E50" rx="2"/>
  
  <!-- Right vertical line with arrow (dark navy) -->
  <g>
    <!-- Vertical line -->
    <rect x="148" y="30" width="12" height="110" fill="#2C3E50" rx="2"/>
    <!-- Arrow top -->
    <path d="M 160 30 L 175 50 L 165 50 Z" fill="#2C3E50"/>
  </g>
  
  <!-- Orange curved D shape -->
  <path d="M 52 30 Q 100 30 100 100 Q 100 170 52 170 Z" fill="none" stroke="#FF6B35" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Checkmark inside D -->
  <path d="M 65 95 L 80 110 L 95 85" fill="none" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
